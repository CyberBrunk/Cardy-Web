<!-- Compatibility preview: first cards, first compatibility card, one planet -->
      <section class="compat-tool" id="compatPreview" aria-labelledby="compatToolTitle">
        <h2 id="compatToolTitle">Check your compatibility</h2>
        <p>Enter both birthdays to see your first cards, your first compatibility card, and a planet you share.</p>
        <div class="cp-form">
          <fieldset class="cp-person-input">
            <legend>You</legend>
            <div class="cp-row">
              <select id="cpYouMonth" aria-label="You birth month"><option value="" disabled selected>Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select>
              <select id="cpYouDay" aria-label="You birth day"><option value="" disabled selected>Day</option></select>
            </div>
          </fieldset>
          <fieldset class="cp-person-input">
            <legend>Them</legend>
            <div class="cp-row"><input type="text" id="cpThemName" maxlength="30" autocomplete="off" placeholder="Their first name (optional)" aria-label="Their first name (optional)" /></div>
            <div class="cp-row">
              <select id="cpThemMonth" aria-label="Them birth month"><option value="" disabled selected>Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select>
              <select id="cpThemDay" aria-label="Them birth day"><option value="" disabled selected>Day</option></select>
            </div>
          </fieldset>
        </div>
        <div class="cp-submit-row">
          <button type="button" class="cp-submit" id="cpSubmit">See how you connect</button>
          <p class="cp-hint" id="cpHint" role="alert" hidden>Pick a month and day for both of you.</p>
        </div>
        <div class="cp-result" id="cpResult" aria-live="polite" hidden></div>
      </section>
